<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Microsoft YaHei','SimHei',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a7a7a"/></marker></defs><text x="380" y="30" font-size="16" fill="#22303c" text-anchor="middle" font-weight="bold">位置与人的四种关系形态</text><rect x="30" y="55" width="145" height="235" rx="8" fill="#fafbfc" stroke="#d9dee4" stroke-width="1" /><text x="102.5" y="82" font-size="14" fill="#22303c" text-anchor="middle" font-weight="bold">一对一</text><rect x="215" y="55" width="145" height="235" rx="8" fill="#fafbfc" stroke="#d9dee4" stroke-width="1" /><text x="287.5" y="82" font-size="14" fill="#22303c" text-anchor="middle" font-weight="bold">一对多</text><rect x="400" y="55" width="145" height="235" rx="8" fill="#fafbfc" stroke="#d9dee4" stroke-width="1" /><text x="472.5" y="82" font-size="14" fill="#22303c" text-anchor="middle" font-weight="bold">多对一</text><rect x="585" y="55" width="145" height="235" rx="8" fill="#fafbfc" stroke="#d9dee4" stroke-width="1" /><text x="657.5" y="82" font-size="14" fill="#22303c" text-anchor="middle" font-weight="bold">空位</text><rect x="72" y="130" width="60" height="46" rx="5" fill="#e3eef9" stroke="#2f6fb0" stroke-width="1" /><text x="102" y="158" font-size="12" fill="#2f6fb0" text-anchor="middle" font-weight="normal">位置</text><line x1="102" y1="176" x2="102" y2="205" stroke="#7a7a7a" stroke-width="1.5" /><circle cx="102" cy="225" r="20" fill="#fff" stroke="#d9822b" stroke-width="1.5" /><text x="102" y="230" font-size="12" fill="#d9822b" text-anchor="middle" font-weight="normal">人</text><circle cx="287" cy="225" r="20" fill="#fff" stroke="#d9822b" stroke-width="1.5" /><text x="287" y="230" font-size="12" fill="#d9822b" text-anchor="middle" font-weight="normal">人</text><line x1="287" y1="205" x2="287" y2="180" stroke="#7a7a7a" stroke-width="1.5" /><line x1="287" y1="180" x2="242" y2="158" stroke="#7a7a7a" stroke-width="1.5" /><line x1="287" y1="180" x2="332" y2="158" stroke="#7a7a7a" stroke-width="1.5" /><rect x="222" y="120" width="48" height="38" rx="5" fill="#e3eef9" stroke="#2f6fb0" stroke-width="1" /><text x="246" y="143" font-size="11" fill="#2f6fb0" text-anchor="middle" font-weight="normal">位置甲</text><rect x="312" y="120" width="48" height="38" rx="5" fill="#e3eef9" stroke="#2f6fb0" stroke-width="1" /><text x="336" y="143" font-size="11" fill="#2f6fb0" text-anchor="middle" font-weight="normal">位置乙</text><rect x="442" y="120" width="70" height="42" rx="5" fill="#e3eef9" stroke="#2f6fb0" stroke-width="1" /><text x="477" y="146" font-size="12" fill="#2f6fb0" text-anchor="middle" font-weight="normal">位置</text><line x1="470" y1="162" x2="445" y2="195" stroke="#7a7a7a" stroke-width="1.5" /><line x1="484" y1="162" x2="509" y2="195" stroke="#7a7a7a" stroke-width="1.5" /><circle cx="440" cy="215" r="20" fill="#fff" stroke="#d9822b" stroke-width="1.5" /><text x="440" y="220" font-size="12" fill="#d9822b" text-anchor="middle" font-weight="normal">人</text><circle cx="514" cy="215" r="20" fill="#fff" stroke="#d9822b" stroke-width="1.5" /><text x="514" y="220" font-size="12" fill="#d9822b" text-anchor="middle" font-weight="normal">人</text><rect x="632" y="130" width="60" height="46" rx="5" fill="#f3f4f6" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="5,4"/><text x="662" y="158" font-size="12" fill="#7a7a7a" text-anchor="middle" font-weight="normal">位置</text><circle cx="662" cy="225" r="20" fill="#fff" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="4,3"/><text x="662" y="230" font-size="12" fill="#7a7a7a" text-anchor="middle" font-weight="normal">空</text><text x="102.5" y="272" font-size="10.5" fill="#555" text-anchor="middle" font-weight="normal">一个位置由一人占据</text><text x="287.5" y="272" font-size="10.5" fill="#555" text-anchor="middle" font-weight="normal">一人占据多个位置</text><text x="472.5" y="272" font-size="10.5" fill="#555" text-anchor="middle" font-weight="normal">多人共同占据一个位置</text><text x="657.5" y="272" font-size="10.5" fill="#555" text-anchor="middle" font-weight="normal">位置存在，但无人