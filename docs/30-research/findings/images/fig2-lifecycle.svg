<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'Microsoft YaHei','SimHei',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a7a7a"/></marker></defs><text x="380" y="30" font-size="16" fill="#22303c" text-anchor="middle" font-weight="bold">位置的生命周期与换人事件</text><rect x="25" y="75" width="120" height="58" rx="6" fill="#e9f0f8" stroke="#2f6fb0" stroke-width="1" /><text x="85" y="100" font-size="13" fill="#22303c" text-anchor="middle" font-weight="bold">候选</text><text x="85" y="120" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">系统自动推断</text><line x1="147" y1="104" x2="163" y2="104" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="165" y="75" width="120" height="58" rx="6" fill="#e9f0f8" stroke="#2f6fb0" stroke-width="1" /><text x="225" y="100" font-size="13" fill="#22303c" text-anchor="middle" font-weight="bold">已确认</text><text x="225" y="120" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">人工确认</text><line x1="287" y1="104" x2="303" y2="104" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="305" y="75" width="120" height="58" rx="6" fill="#e6f2ea" stroke="#4a8f5b" stroke-width="1" /><text x="365" y="100" font-size="13" fill="#22303c" text-anchor="middle" font-weight="bold">稳定运行</text><text x="365" y="120" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">持续承载任务</text><line x1="427" y1="104" x2="443" y2="104" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="445" y="75" width="120" height="58" rx="6" fill="#e9f0f8" stroke="#2f6fb0" stroke-width="1" /><text x="505" y="100" font-size="13" fill="#22303c" text-anchor="middle" font-weight="bold">合并或拆分</text><text x="505" y="120" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">职责调整</text><line x1="567" y1="104" x2="583" y2="104" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="585" y="75" width="120" height="58" rx="6" fill="#e9f0f8" stroke="#2f6fb0" stroke-width="1" /><text x="645" y="100" font-size="13" fill="#22303c" text-anchor="middle" font-weight="bold">空位</text><text x="645" y="120" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">无人占据</text><line x1="645" y1="135" x2="695" y2="165" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="650" y="168" width="85" height="46" rx="6" fill="#f3f4f6" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="5,4"/><text x="692" y="196" font-size="13" fill="#7a7a7a" text-anchor="middle" font-weight="normal">消失</text><line x1="365" y1="133" x2="365" y2="200" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="5,4"/><rect x="275" y="200" width="180" height="52" rx="6" fill="#fff7e8" stroke="#d9822b" stroke-width="1" /><text x="365" y="221" font-size="12" fill="#8a5a13" text-anchor="middle" font-weight="bold">换人事件</text><text x="365" y="240" font-size="10" fill="#8a5a13" text-anchor="middle" font-weight="normal">仅替换占据者，位置保留</text><text x="25" y="260" font-size="10.5" fill="#444" text-anchor="start" font-weight="normal">换人时：名称与职责范围保留；占据者、备份状态、负载与最近活动时间重新计算；历史证据保留。</text><text x="25" y="280" font-size="10.5" fill="#444" text-anchor="start" font-weight="normal">合并或拆分可撤销；空位与消失必须显式记录，不得用“某人”代替空位。</text>
</svg>
