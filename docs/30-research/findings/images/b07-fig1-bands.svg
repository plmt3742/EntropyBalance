<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a7a7a"/></marker><marker id="arrowo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9822b"/></marker><marker id="arrowg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a8f5b"/></marker><marker id="arrowb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2f6fb0"/></marker></defs><text x="380" y="28" font-size="16" fill="#22303c" text-anchor="middle" font-weight="bold">图 1：合并评分的三个区间（模拟示例）</text><rect x="60" y="90" width="396" height="70" rx="0" fill="#eef0f2" stroke="#7a7a7a" stroke-width="1.4" /><text x="258" y="120" font-size="13" fill="#7a7a7a" text-anchor="middle" font-weight="bold">不合并</text><text x="258" y="142" font-size="10.5" fill="#555" text-anchor="middle" font-weight="normal">保留为两条</text><rect x="456" y="90" width="165" height="70" rx="0" fill="#fff1d6" stroke="#d9822b" stroke-width="1.4" /><text x="538.5" y="120" font-size="13" fill="#d9822b" text-anchor="middle" font-weight="bold">灰区</text><text x="538.5" y="142" font-size="10.5" fill="#555" text-anchor="middle" font-weight="normal">人工确认</text><rect x="621" y="90" width="99" height="70" rx="0" fill="#e2f0e6" stroke="#4a8f5b" stroke-width="1.4" /><text x="670.5" y="120" font-size="13" fill="#4a8f5b" text-anchor="middle" font-weight="bold">直接合并</text><text x="670.5" y="142" font-size="10.5" fill="#555" text-anchor="middle" font-weight="normal">记录依据</text><line x1="60" y1="160" x2="60" y2="166" stroke="#888" stroke-width="1" /><text x="60" y="184" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">0.0</text><line x1="126" y1="160" x2="126" y2="166" stroke="#888" stroke-width="1" /><line x1="192" y1="160" x2="192" y2="166" stroke="#888" stroke-width="1" /><text x="192" y="184" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">0.2</text><line x1="258" y1="160" x2="258" y2="166" stroke="#888" stroke-width="1" /><line x1="324" y1="160" x2="324" y2="166" stroke="#888" stroke-width="1" /><text x="324" y="184" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">0.4</text><line x1="390" y1="160" x2="390" y2="166" stroke="#888" stroke-width="1" /><line x1="456" y1="160" x2="456" y2="166" stroke="#888" stroke-width="1" /><text x="456" y="184" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">0.6</text><line x1="522" y1="160" x2="522" y2="166" stroke="#888" stroke-width="1" /><line x1="588" y1="160" x2="588" y2="166" stroke="#888" stroke-width="1" /><text x="588" y="184" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">0.8</text><line x1="654" y1="160" x2="654" y2="166" stroke="#888" stroke-width="1" /><line x1="720" y1="160" x2="720" y2="166" stroke="#888" stroke-width="1" /><text x="720" y="184" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">1.0</text><text x="64" y="78" font-size="11" fill="#444" text-anchor="start" font-weight="normal">评分</text><text x="60" y="220" font-size="11" fill="#444" text-anchor="start" font-weight="normal">说明：错误合并的代价高于错误拆分，阈值默认偏保守；灰区必须人工确认并记录理由。</text><text x="60" y="245" font-size="11" fill="#444" text-anchor="start" font-weight="normal">强键命中时跳过评分直接合并，但仍需记录依据，便于撤销。</text><text x="736" y="288" font-size="9.5" fill="#777" text-anchor="end" font-weight="normal">模拟示例（S），非真实调研数据</text>
</svg>
