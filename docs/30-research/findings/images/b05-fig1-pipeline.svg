<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'Microsoft YaHei','SimHei',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a7a7a"/></marker><marker id="arrowo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9822b"/></marker><marker id="arrowg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a8f5b"/></marker><marker id="arrowb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2f6fb0"/></marker></defs><text x="380" y="28" font-size="16" fill="#22303c" text-anchor="middle" font-weight="bold">图 1：标注与评测流程</text><rect x="22" y="62" width="158" height="62" rx="6" fill="#f7f9fb" stroke="#2f6fb0" stroke-width="1.4" /><text x="101" y="87" font-size="12.5" fill="#2f6fb0" text-anchor="middle" font-weight="bold">分层抽样</text><text x="101" y="107" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">按类型与长度</text><line x1="182" y1="93" x2="191" y2="93" stroke="#7a7a7a" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="194" y="62" width="158" height="62" rx="6" fill="#f7f9fb" stroke="#2f6fb0" stroke-width="1.4" /><text x="273" y="87" font-size="12.5" fill="#2f6fb0" text-anchor="middle" font-weight="bold">冻结清单</text><text x="273" y="107" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">标注期不换样本</text><line x1="354" y1="93" x2="363" y2="93" stroke="#7a7a7a" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="366" y="62" width="158" height="62" rx="6" fill="#f7f9fb" stroke="#2f6fb0" stroke-width="1.4" /><text x="445" y="87" font-size="12.5" fill="#2f6fb0" text-anchor="middle" font-weight="bold">双人独立标注</text><text x="445" y="107" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">同一版规范</text><line x1="526" y1="93" x2="535" y2="93" stroke="#7a7a7a" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="538" y="62" width="158" height="62" rx="6" fill="#f7f9fb" stroke="#d9822b" stroke-width="1.4" /><text x="617" y="87" font-size="12.5" fill="#d9822b" text-anchor="middle" font-weight="bold">一致性检查</text><text x="617" y="107" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">字段级计算</text><rect x="22" y="182" width="158" height="62" rx="6" fill="#f7f9fb" stroke="#d9822b" stroke-width="1.4" /><text x="101" y="207" font-size="12.5" fill="#d9822b" text-anchor="middle" font-weight="bold">分歧裁决</text><text x="101" y="227" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">理由必填</text><line x1="182" y1="213" x2="191" y2="213" stroke="#7a7a7a" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="194" y="182" width="158" height="62" rx="6" fill="#f7f9fb" stroke="#4a8f5b" stroke-width="1.4" /><text x="273" y="207" font-size="12.5" fill="#4a8f5b" text-anchor="middle" font-weight="bold">锁定金标准</text><text x="273" y="227" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">只追加版本</text><line x1="354" y1="213" x2="363" y2="213" stroke="#7a7a7a" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="366" y="182" width="158" height="62" rx="6" fill="#f7f9fb" stroke="#4a8f5b" stroke-width="1.4" /><text x="445" y="207" font-size="12.5" fill="#4a8f5b" text-anchor="middle" font-weight="bold">划分开发与测试</text><text x="445" y="227" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">按记录划分</text><line x1="526" y1="213" x2="535" y2="213" stroke="#7a7a7a" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="538" y="182" width="158" height="62" rx="6" fill="#f7f9fb" stroke="#4a8f5b" stroke-width="1.4" /><text x="617" y="207" font-size="12.5" fill="#4a8f5b" text-anchor="middle" font-weight="bold">评测与报告</text><text x="617" y="227" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">区间与样本量</text><path d="M617,126 L617,154 L101,154 L101,178" fill="none" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="22" y="258" font-size="11" fill="#444" text-anchor="start" font-weight="normal">要求：标注者先独立完成，裁决前不查看对方结果；测试集在阶段性评测前保持锁定。</text><text x="736" y="288" font-size="9.5" fill="#777" text-anchor="end" font-weight="normal">模拟示例（S），非真实调研数据</text>
</svg>
